name: sistema-estoque
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute Instalar.cmd primeiro}
      TZ: America/Sao_Paulo
    volumes:
      - dados:/var/lib/postgresql
      - ./implantacao/dados-iniciais.sql:/docker-entrypoint-initdb.d/01-dados.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    logging:
      options:
        max-size: 10m
        max-file: "3"
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/estoque
      SPRING_DATASOURCE_USERNAME: estoque
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Execute Instalar.cmd primeiro}
      SPRING_JPA_SHOW_SQL: "false"
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -Duser.timezone=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/products]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    logging:
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: 10m
        max-file: "3"
volumes:
  dados:
